name: package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sample event tests
        run: python3 tests/test_samples.py
      - name: Build .spl packages
        run: make package
      - name: AppInspect (if installed)
        run: |
          pip install splunk-appinspect
          for f in dist/*.spl; do
            splunk-appinspect inspect "$f" --included-tags cloud --data-format json --output-file "${f%.spl}-cloud.json" || true
            splunk-appinspect inspect "$f" --included-tags private_app --data-format json --output-file "${f%.spl}-private.json" || true
          done
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: spl-packages
          path: dist/
