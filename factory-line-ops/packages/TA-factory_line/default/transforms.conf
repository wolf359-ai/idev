# Index-time PII backstop for workforce sourcetypes. Does not embed a hash
# pepper (that belongs on the collector as FLO_PII_PEPPER).
# worker_id is an opaque join key (UUID) and is left intact for roster KV.

[flo_drop_pii_fields]
INGEST_EVAL = first_name:=null(), last_name:=null(), display_name:=null(), worker_name:=null(), email:=null(), phone:=null(), ssn:=null(), badge_id:=null()

[flo_device_inventory]
filename = flo_device_inventory.csv

[flo_event_type_map]
filename = flo_event_type_map.csv
