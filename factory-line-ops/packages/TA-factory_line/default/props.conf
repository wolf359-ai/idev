# Search-time JSON extraction. Index-time sourcetype is set by the HEC token
# or the event's sourcetype field. Do not put HEC tokens here.

[factory:shift:clock]
SHOULD_LINEMERGE = false
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIME_PREFIX = "time"\s*:\s*
TIME_FORMAT = %s
TZ = UTC
TRUNCATE = 10000
CATEGORY = Factory Line Operations
DESCRIPTION = Workforce clock in/out/break events
EVAL-vertical = "manufacturing"
EVAL-system = if(isnull(system),"Workforce",system)

