[flo_kv_sites]
external_type = kvstore
collection = flo_sites
fields_list = _key, site_id, site_name, enterprise, tz, notify_shift, notify_plant

[flo_kv_lines]
external_type = kvstore
collection = flo_lines
fields_list = _key, site_id, line_id, line_name, area, planned_headcount, min_crew, down_alert_minutes, target_units_per_shift

[flo_kv_stations]
external_type = kvstore
collection = flo_stations
fields_list = _key, site_id, line_id, station_id, role, required

[flo_kv_shift_calendar]
external_type = kvstore
collection = flo_shift_calendar
fields_list = _key, site_id, shift_code, start_local, end_local, crosses_midnight, crew_grace_min

[flo_kv_roster]
external_type = kvstore
collection = flo_roster
fields_list = _key, site_id, shift_id, line_id, station_id, worker_id, role, planned_start, planned_end

[flo_kv_roster_presence]
external_type = kvstore
collection = flo_roster_presence
fields_list = _key, site_id, shift_id, line_id, station_id, worker_id, clock_in, clock_out

[flo_kv_worker_display]
external_type = kvstore
collection = flo_worker_display
fields_list = _key, worker_id, first_name

[flo_current_shift_snapshot]
filename = flo_current_shift_snapshot.csv

[flo_sites_seed]
filename = flo_sites_seed.csv

[flo_lines_seed]
filename = flo_lines_seed.csv

[flo_shift_calendar_seed]
filename = flo_shift_calendar_seed.csv
