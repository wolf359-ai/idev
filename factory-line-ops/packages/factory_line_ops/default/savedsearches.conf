# Snapshot and summary searches. Alert actions (email, Slack) are configured
# on the Splunk instance — do not put recipient addresses or tokens here.

[FLO current shift snapshot]
description = Writes per-line current-shift staffing and output into a lookup used by plant and line dashboards.
search = `factory_ops_indexes` sourcetype=factory:line:state OR sourcetype=factory:line:production OR sourcetype=factory:line:downtime earliest=-12h \
| stats latest(state_value) as state_value, sum(good_count) as good_count_shift, sum(downtime_minutes) as downtime_minutes_shift by site, line_id, shift_id \
| append [ search `factory_workforce_indexes` sourcetype=factory:shift:clock earliest=-12h \
  | stats latest(action) as action by site, line_id, shift_id, worker_id \
  | where action="clock_in" \
  | stats dc(worker_id) as headcount_actual by site, line_id, shift_id ] \
| stats latest(state_value) as state_value, max(good_count_shift) as good_count_shift, max(downtime_minutes_shift) as downtime_minutes_shift, max(headcount_actual) as headcount_actual by site, line_id, shift_id \
| lookup flo_kv_lines site_id as site, line_id OUTPUT planned_headcount as headcount_plan, down_alert_minutes \
| eval fill_pct = if(headcount_plan>0, round(headcount_actual/headcount_plan*100,1), null()) \
| eval updated = now() \
| outputlookup flo_current_shift_snapshot
dispatch.earliest_time = -12h
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 0
is_scheduled = 0
schedule_window = auto
request.ui_dispatch_app = factory_line_ops

[FLO enterprise 5m summary]
description = Populates factory_summary for the business-layer dashboard. Enable after indexes exist.
search = | inputlookup flo_current_shift_snapshot \
| eval _time = now() \
| collect index=factory_summary marker="source=flo_summary,sourcetype=factory:summary:5m"
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
is_scheduled = 0
request.ui_dispatch_app = factory_line_ops

[FLO alert line understaffed]
description = Lines below 90% of planned headcount on the current shift snapshot.
search = | inputlookup flo_current_shift_snapshot \
| where isnotnull(headcount_plan) AND headcount_plan > 0 AND fill_pct < 90 \
| table site, line_id, shift_id, headcount_plan, headcount_actual, fill_pct
enableSched = 0
is_scheduled = 0
cron_schedule = * * * * *
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 15m
alert.suppress.fields = site,line_id,shift_id
alert.expires = 2h
counttype = number of events
relation = greater than
quantity = 0
request.ui_dispatch_app = factory_line_ops

[FLO alert line down]
description = Lines whose latest snapshot state is down.
search = | inputlookup flo_current_shift_snapshot \
| where state_value="down" \
| table site, line_id, shift_id, downtime_minutes_shift, updated
enableSched = 0
is_scheduled = 0
cron_schedule = * * * * *
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 10m
alert.suppress.fields = site,line_id,shift_id
alert.expires = 2h
counttype = number of events
relation = greater than
quantity = 0
request.ui_dispatch_app = factory_line_ops
